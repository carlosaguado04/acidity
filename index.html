<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070708" />
    <meta
      name="description"
      content="Acidity — one-person studio. Apps you’d keep. Sites that carry the product."
    />
    <title>Acidity</title>
    <link rel="preload" href="/assets/fonts/Anurati-Regular.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/assets/fonts/Satoshi-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/Satoshi-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/shell.css" />
    <link rel="stylesheet" href="/assets/css/home.css" />
    <link rel="stylesheet" href="/assets/css/studio.css" />
    <link rel="stylesheet" href="/assets/css/apps.css" />
    <link rel="stylesheet" href="/assets/css/web.css" />
    <style>
      /* First paint: keep Acidity hidden until GSAP primes the letter intro */
      .page-home .home-story:not(.is-ready) .wordmark,
      .page-home .home-story:not(.is-ready) .hero-line,
      .page-home .home-story:not(.is-ready) .explore-deck {
        opacity: 0;
        visibility: hidden;
      }
      @media (prefers-reduced-motion: reduce) {
        .page-home .home-story:not(.is-ready) .wordmark,
        .page-home .home-story:not(.is-ready) .hero-line,
        .page-home .home-story:not(.is-ready) .explore-deck {
          opacity: 1;
          visibility: visible;
        }
      }
    </style>
    <noscript>
      <style>
        .page-home .home-story .wordmark,
        .page-home .home-story .hero-line,
        .page-home .home-story .explore-deck,
        .page-home .wordmark .char {
          opacity: 1;
          visibility: visible;
        }
      </style>
    </noscript>
  </head>
  <body class="page-home is-booting">
    <a class="skip" href="#main">Skip to content</a>
    <div class="site-shell">
      <div class="site-bg" aria-hidden="true"></div>

      <main id="main" class="site-main">
        <div class="home-flight" data-home-flight>
          <section class="home-story" data-home-story data-explore aria-label="Acidity">
            <div class="home-pin" data-home-pin>
              <h1 class="wordmark" data-split aria-label="Acidity"><span class="char">A</span><span class="char">c</span><span class="char">i</span><span class="char">d</span><span class="char">i</span><span class="char">t</span><span class="char">y</span><span class="wordmark-load" data-home-boot-pulse aria-hidden="true"></span></h1>
              <p class="hero-line">App and web development</p>
<div class="explore-deck" data-explore-deck>
                <a
                  class="explore-card"
                  data-card
                  href="/studio/"
                  style="--tilt:-7deg;--x:-18%;--y:8%;--z:1"
                >
                <div class="explore-card-face" data-card-face>
                  <span class="stage-index">01</span>
                  <div class="stage-body">
                    <h3>Studio</h3>
                    <p class="stage-copy">One person. Two lines of work. The whole thing.</p>
                    <span class="stage-link">Enter studio →</span>
                  </div>
                                </div>
              </a>
                <a
                  class="explore-card"
                  data-card
                  href="/apps/"
                  style="--tilt:3deg;--x:0%;--y:-4%;--z:3"
                >
                <div class="explore-card-face" data-card-face>
                  <span class="stage-index">02</span>
                  <div class="stage-body">
                    <h3>Apps</h3>
                    <p class="stage-copy">Mise. Hilo. Orza. Built for my machine first.</p>
                    <span class="stage-link">See apps →</span>
                  </div>
                                </div>
              </a>
                <a
                  class="explore-card"
                  data-card
                  href="/web/"
                  style="--tilt:8deg;--x:18%;--y:10%;--z:2"
                >
                <div class="explore-card-face" data-card-face>
                  <span class="stage-index">03</span>
                  <div class="stage-body">
                    <h3>Web</h3>
                    <p class="stage-copy">Sites that carry the product — not a pretty shell.</p>
                    <span class="stage-link">Web work →</span>
                  </div>
                                </div>
              </a>
              </div>
            </div>
          </section>
        </div>
      </main>
</div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/motion.js"></script>
    <script src="/assets/js/interact.js"></script>
    <script src="/assets/js/transit.js"></script>
  </body>
</html>
